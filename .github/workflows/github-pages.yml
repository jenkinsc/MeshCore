name: Build and deploy RAK9154 docs site to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  github-pages:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Build
        run: |
          pip install mkdocs-material
          mkdir _site_src
          cp pages/index.md docs/RAK9154.md docs/RAK9154-IMPLEMENTATION-PLAN.md _site_src/
          mkdocs build -f mkdocs-rak9154.yml

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: 'gh-pages'
