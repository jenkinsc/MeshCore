; RAK4631 repeater that reads its battery state from a RAK9154 Solar Battery over the Output 1
; "SensorHub" one-wire interface instead of the (unconnected) on-board battery ADC.
; See docs/RAK9154.md and docs/RAK9154-IMPLEMENTATION-PLAN.md.
;
; This lives in its own directory on purpose: platformio.ini loads variants/*/platformio.ini, so this file
; never touches upstream's variants/rak4631/platformio.ini and cannot conflict when merging upstream.
; The driver sources are under variants/rak4631/rak9154/ and are already part of the stock target's
; source filter; every one of them compiles to nothing unless RAK9154_BATTERY is defined.
;
; !!! RAK9154_ONEWIRE_PIN defaults to PIN_SERIAL1_RX (P0.15) and is UNVERIFIED for your harness. !!!
[env:RAK_4631_repeater_RAK9154]
extends = env:RAK_4631_repeater
build_flags =
  ${env:RAK_4631_repeater.build_flags}
  -D RAK9154_BATTERY
  ; P0.15 (PIN_SERIAL1_RX) is also the GPS UART RX in the RAK4631 variant, so GPS is off in this target.
  ; If you move the one-wire pin elsewhere (-D RAK9154_ONEWIRE_PIN=<n>) you may remove this line.
  -UENV_INCLUDE_GPS
  -UADVERT_NAME
  -D ADVERT_NAME='"RAK9154 Repeater"'
;  -D RAK9154_ONEWIRE_PIN=15
;  -D RAK9154_POLL_INTERVAL_MS=30000
;  -D RAK9154_DEBUG
;  -D RAK9154_RSP_BIG_ENDIAN=1
;  -D RAK9154_REPORT_BIG_ENDIAN=0
